services:
  postgres:
    image: postgres:17-alpine
    container_name: privacy-postgres
    environment:
      POSTGRES_USER: privacy
      POSTGRES_PASSWORD: privacy
      POSTGRES_DB: privacy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U privacy -d privacy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
